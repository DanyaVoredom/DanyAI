[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danyai"
version = "0.2.0"
description = "Local language model family"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
colab = ["playwright"]

[tool.setuptools.packages.find]
include = ["danyai*"]